name: Remote sales collection pass

on:
  workflow_call:
    inputs:
      max_products:
        required: true
        type: string
      collection_date:
        required: true
        type: string
      retry_failed:
        type: boolean
        default: false
      authorized_export:
        type: boolean
        default: false
      publish_only:
        type: boolean
        default: false
    secrets:
      history_export_url:
        required: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_PRODUCTS: ${{ inputs.max_products }}
      RETRY_FAILED: ${{ inputs.retry_failed }}
      COLLECTION_DATE: ${{ inputs.collection_date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure repository-scoped publishing credentials
        run: git config --global credential.https://github.com.helper '!gh auth git-credential'
      - name: Restore retained public history and resumable queue
        id: restore
        run: |
          mkdir -p data
          gh release download daily-volume --pattern remote-state.sqlite.gz --dir data
          gzip -dc data/remote-state.sqlite.gz > data/sales.sqlite
          node --input-type=module -e "import {Store} from './src/store.js'; const s=new Store('data/sales.sqlite'); const result=s.db.prepare('PRAGMA quick_check').get(); s.close(); if(Object.values(result)[0]!=='ok') throw new Error('Invalid remote checkpoint'); console.log(result);"
      - name: Collect native daily history without a Mac
        if: ${{ !inputs.authorized_export && !inputs.publish_only }}
        run: |
          args=()
          if [[ "$RETRY_FAILED" == "true" ]]; then args+=(--retry-failed); fi
          xvfb-run -a node src/remote.js --limit "$MAX_PRODUCTS" --minutes 30 "${args[@]}"
      - name: Import the authorized daily export
        if: ${{ inputs.authorized_export && !inputs.publish_only }}
        env:
          TCGPLAYER_HISTORY_EXPORT_URL: ${{ secrets.history_export_url }}
        run: |
          if [[ -z "$TCGPLAYER_HISTORY_EXPORT_URL" ]]; then
            echo "::error::No approved history export URL is configured."
            exit 1
          fi
          npm run catalog
          if ! node src/publish.js --check-stored data/sales.sqlite; then
            npm run import:history -- --download
          fi
      - name: Persist a public-only checkpoint even after a collection failure
        id: checkpoint
        if: ${{ always() && !cancelled() && (!inputs.authorized_export || inputs.publish_only) && steps.restore.outcome == 'success' }}
        run: |
          node src/remote.js --checkpoint data/sales.sqlite data/public-state.sqlite
          gzip -c data/public-state.sqlite > data/remote-state.sqlite.gz
          node src/publish.js --upload-assets data/remote-state.sqlite.gz
      - name: Publish complete downloads and honest sweep coverage
        if: ${{ always() && !cancelled() && steps.checkpoint.outcome == 'success' }}
        run: npm run publish
      - name: Verify and publish the authorized daily export
        if: ${{ inputs.authorized_export && !inputs.publish_only }}
        run: npm run publish -- --from-export
