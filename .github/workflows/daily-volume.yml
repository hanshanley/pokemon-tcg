name: Daily remote Pokemon sales

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      max_products:
        description: Maximum products per bounded pass (1-2000); use 100 for validation
        type: number
        default: 2000
      retry_failed:
        description: Revalidate exhausted failed products once (does not change source validation)
        type: boolean
        default: false
      republish:
        description: Rebuild reports and downloads from the retained checkpoint without collecting source data
        type: boolean
        default: false
      remaining_runs:
        description: Maximum additional bounded runs for this queue (0-12); stops on completion, errors, or no progress
        type: string
        default: '12'

permissions:
  contents: write
  actions: write

concurrency:
  group: remote-daily-data
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      mode: ${{ steps.plan.outputs.mode }}
      date: ${{ steps.plan.outputs.date }}
      baseline: ${{ steps.plan.outputs.baseline }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check today's sweep and the current source catalog build
        id: plan
        env:
          TCGPLAYER_HISTORY_ACCESS: ${{ vars.TCGPLAYER_HISTORY_ACCESS }}
          REPUBLISH: ${{ inputs.republish || false }}
          MAX_PRODUCTS: ${{ inputs.max_products || 2000 }}
          REMAINING_RUNS: ${{ inputs.remaining_runs || '12' }}
        run: |
          if [[ ! "$MAX_PRODUCTS" =~ ^[0-9]+$ ]] || (( MAX_PRODUCTS < 1 || MAX_PRODUCTS > 2000 )); then
            echo "::error::Each collection pass must request between 1 and 2000 products."
            exit 1
          fi
          if [[ ! "$REMAINING_RUNS" =~ ^([0-9]|1[0-2])$ ]]; then
            echo "::error::Continuation budget must be between 0 and 12."
            exit 1
          fi
          case "$TCGPLAYER_HISTORY_ACCESS" in
            ''|approved) mode=native ;;
            approved-export) mode=export ;;
            paused)
              echo "::error::Daily TCGplayer collection is explicitly paused. Saved reports were not changed."
              exit 1
              ;;
            *)
              echo "::error::Unknown TCGPLAYER_HISTORY_ACCESS value; use approved, approved-export, or paused, or leave it unset for native collection."
              exit 1
              ;;
          esac
          git fetch --depth=1 origin main
          git show FETCH_HEAD:reports/latest/coverage.json > "$RUNNER_TEMP/coverage.json"
          collection_date=$(date -u +%F)
          if [[ "$mode" == "native" ]]; then
            collection_date=$(node src/publish.js --queue-date "$RUNNER_TEMP/coverage.json")
          fi
          echo "date=$collection_date" >> "$GITHUB_OUTPUT"
          echo "baseline=$(node -p 'const c=JSON.parse(require("fs").readFileSync(process.argv[1])); JSON.stringify({date_utc:process.argv[2],products_checked:c.sweep?.date_utc===process.argv[2]?c.sweep.products_checked:0})' "$RUNNER_TEMP/coverage.json" "$collection_date")" >> "$GITHUB_OUTPUT"
          if [[ "$REPUBLISH" == "true" ]]; then
            needed=true
          else
            needed=$(COLLECTION_DATE="$collection_date" node src/publish.js --needs-collection "$RUNNER_TEMP/coverage.json")
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
  first:
    needs: plan
    if: ${{ needs.plan.outputs.needed == 'true' }}
    uses: ./.github/workflows/remote-volume-pass.yml
    with:
      max_products: ${{ format('{0}', inputs.max_products || 2000) }}
      collection_date: ${{ needs.plan.outputs.date }}
      retry_failed: ${{ inputs.retry_failed || false }}
      authorized_export: ${{ needs.plan.outputs.mode == 'export' }}
      publish_only: ${{ inputs.republish || false }}
    secrets:
      history_export_url: ${{ secrets.TCGPLAYER_HISTORY_EXPORT_URL }}
  second:
    needs: [plan, first]
    if: ${{ needs.plan.outputs.mode == 'native' && !inputs.republish }}
    uses: ./.github/workflows/remote-volume-pass.yml
    with:
      max_products: ${{ format('{0}', inputs.max_products || 2000) }}
      collection_date: ${{ needs.plan.outputs.date }}
  third:
    needs: [plan, second]
    uses: ./.github/workflows/remote-volume-pass.yml
    with:
      max_products: ${{ format('{0}', inputs.max_products || 2000) }}
      collection_date: ${{ needs.plan.outputs.date }}
  verify:
    needs: [plan, first, third]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      next: ${{ steps.continuation.outputs.next }}
    env:
      GH_TOKEN: ${{ github.token }}
      COLLECTION_DATE: ${{ needs.plan.outputs.date }}
      BASELINE: ${{ needs.plan.outputs.baseline }}
      REMAINING_RUNS: ${{ inputs.remaining_runs || '12' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify the saved batch and require full reconciliation for completed sweeps
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:reports/latest/coverage.json > "$RUNNER_TEMP/coverage.json"
          gh release download daily-volume --pattern remote-state.sqlite.gz --dir "$RUNNER_TEMP"
          gzip -dc "$RUNNER_TEMP/remote-state.sqlite.gz" > "$RUNNER_TEMP/public.sqlite"
          status=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).sweep.status' "$RUNNER_TEMP/coverage.json")
          if [[ "$status" == "complete" ]]; then
            node src/publish.js --complete "$RUNNER_TEMP/coverage.json" "$RUNNER_TEMP/public.sqlite"
          else
            node src/publish.js --reports "$RUNNER_TEMP/coverage.json" "$RUNNER_TEMP/public.sqlite"
            echo "::notice::Bounded batch saved; the catalog queue remains $status. This is not a complete-sweep certification."
          fi
      - name: Plan a bounded continuation only after verified progress
        id: continuation
        if: ${{ needs.plan.outputs.mode == 'native' && !inputs.republish && needs.first.result == 'success' && needs.third.result == 'success' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { nextCollectionContinuation } from './src/publish.js';
          const coverage = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/coverage.json`));
          const next = nextCollectionContinuation(JSON.parse(process.env.BASELINE), coverage, Number(process.env.REMAINING_RUNS));
          appendFileSync(process.env.GITHUB_OUTPUT, `next=${next ?? 'stop'}\n`);
          JS
  continue:
    needs: [plan, verify]
    if: ${{ needs.verify.outputs.next != '' && needs.verify.outputs.next != 'stop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NEXT: ${{ needs.verify.outputs.next }}
      MAX_PRODUCTS: ${{ inputs.max_products || 2000 }}
    steps:
      - name: Cool down before resuming the saved queue in another bounded run
        run: |
          sleep 300
          gh workflow run daily-volume.yml --ref main -f "max_products=$MAX_PRODUCTS" -f "remaining_runs=$NEXT"
