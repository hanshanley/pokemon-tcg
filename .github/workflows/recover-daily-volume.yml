name: Recover interrupted daily sales runner

on:
  workflow_run:
    workflows: ['Daily remote Pokemon sales']
    types: [completed]
    branches: [main]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Retry only confirmed runner loss, at most twice
        run: node src/recover.js
