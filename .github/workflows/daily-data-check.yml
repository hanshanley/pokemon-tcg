name: Daily sales data freshness

on:
  schedule:
    - cron: '45 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify saved progress, chart freshness, and honest sweep status
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:reports/latest/coverage.json > "$RUNNER_TEMP/coverage.json"
          gh release download daily-volume --pattern remote-state.sqlite.gz --dir "$RUNNER_TEMP"
          gzip -dc "$RUNNER_TEMP/remote-state.sqlite.gz" > "$RUNNER_TEMP/public.sqlite"
          node src/publish.js --health "$RUNNER_TEMP/coverage.json" "$RUNNER_TEMP/public.sqlite"
