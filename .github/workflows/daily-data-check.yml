name: Daily sales data freshness

on:
  schedule:
    - cron: '45 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check published data, not just the workflow timestamp
        run: |
          git fetch --depth=1 origin daily-data
          git show FETCH_HEAD:reports/latest/coverage.json > "$RUNNER_TEMP/coverage.json"
          node src/publish.js --check "$RUNNER_TEMP/coverage.json"
